# ---------------------------------------------------------------------------
# Shared defaults for every environment.
#
# Resolution order (first match wins):
#   -Dkey=value  >  ENV_VAR (KEY_WITH_UNDERSCORES)  >  config-<env>.properties  >  this file
#
# Jenkins therefore switches environment with -Denv=uat and nothing else changes.
# ---------------------------------------------------------------------------
env=sit

# HTTP behaviour
http.connect.timeout.ms=10000
http.response.timeout.ms=30000

# Non-functional expectation applied by assertions and response specifications
sla.response.time.ms=10000

# Console + Allure logging of every request/response
logging.requests.enabled=true

# Extra attempts granted to a failing test (0 = fail fast, recommended)
retry.count=0

# Authentication defaults; each environment supplies its own credentials.
auth.enabled=true
auth.token.endpoint=/login
auth.grant.type=password_json
auth.token.ttl.seconds=900
auth.token.refresh.skew.seconds=60
