# ---------------------------------------------------------------------------
# MOCK — offline mode. BaseTest starts WireMock from src/test/resources/wiremock
# and overrides base.uri with the port it picked. Used by CI and for proving a
# failure belongs to the service rather than to the suite.
# ---------------------------------------------------------------------------
base.uri=http://localhost:8080
base.path=/api

api.key.header=x-api-key
api.key=reqres-free-v1

# The stub exposes a standard OAuth2 endpoint, so this environment exercises the
# access_token / expires_in parsing path of the TokenManager.
auth.enabled=true
auth.token.endpoint=/oauth/token
auth.grant.type=client_credentials
auth.client.id=api-automation
auth.client.secret=local-only-not-a-secret
auth.token.ttl.seconds=300
auth.token.refresh.skew.seconds=30

# 0 = pick any free port at runtime.
mock.port=0
sla.response.time.ms=10000
